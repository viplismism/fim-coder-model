model:
  name: deepseek-ai/deepseek-coder-6.7b-base
  revision: ce2207a8bfef3ee92bd7dd4cc31c52cfa0046912
format:
  bos: <｜begin▁of▁sentence｜>
  eos: <｜end▁of▁sentence｜>
  fim_begin: <｜fim▁begin｜>
  fim_hole: <｜fim▁hole｜>
  fim_end: <｜fim▁end｜>
split:
  unit: package_count
  seed: 20261101
