    train: 0.8
    validation: 0.1
    test: 0.1
data:
  seed: 20261101
  bytes_per_example: 2048
  max_seq_tokens: 4096
  max_middle_tokens: null
  context_trim: line
  keyword_text_exempt_types:
  - string_content
