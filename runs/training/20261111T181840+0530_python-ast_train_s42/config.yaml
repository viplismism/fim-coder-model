  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  num_train_epochs: 1
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_torch
  seed: 42
  eval_steps: 50
  save_steps: 50
  checkpoint_policy: final
  validation_subset: validation_subset.json
  gradient_checkpointing: true
  bf16: true
  report_to: none
wandb:
  enabled: false              # set true + your entity to log configs and scalars to a PRIVATE W&B project
  entity: null                # your W&B entity
  project: ast-aware-fim-finetuning
  mode: online
  allowed_access:
  - PRIVATE
