[package]
name = "ast_extractor"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
crossbeam-channel = "0.5"

[[bin]]
name = "ast_extractor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
